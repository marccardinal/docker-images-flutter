name: Build and Push
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - DOCKER_TAG: latest
            FLUTTER_VERSION: 3.47.2
          - DOCKER_TAG: stable
            FLUTTER_VERSION: 3.47.2
          - DOCKER_TAG: beta
            FLUTTER_VERSION: 3.48.0-0.4.pre
    name: flutter:${{ matrix.DOCKER_TAG }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: sdk
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/master' }}
          build-args: flutter_version=${{ matrix.FLUTTER_VERSION }}
          tags: |
            marccardinal/flutter:${{ matrix.DOCKER_TAG }}
            marccardinal/flutter:${{ matrix.FLUTTER_VERSION }}
          cache-from: type=gha,scope=${{ matrix.DOCKER_TAG }}
          cache-to: type=gha,mode=max,scope=${{ matrix.DOCKER_TAG }}
